$kind: http-request
name: 'Confirm Booking (Admin)'
method: PUT
url: '{{baseUrl}}/api/booking/{{bookingId}}/confirm'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "paymentStatus": "paid"
    }
