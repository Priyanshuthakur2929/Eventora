$kind: http-request
method: POST
url: '{{baseUrl}}/api/booking'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "eventId": "{{eventId}}",
      "otp": "123456"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res._id) { pm.collectionVariables.set('bookingId', res._id); }
