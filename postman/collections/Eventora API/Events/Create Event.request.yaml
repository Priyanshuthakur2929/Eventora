$kind: http-request
name: Create Event (Admin)
method: POST
url: "{{baseUrl}}/api/events"
order: 3000
auth:
  type: bearer
headers:
  Content-Type: application/json
  Authorization: ""
body:
  type: json
  content: |-
    {
      "title": "Music Festival 2025",
      "description": "A grand music festival",
      "date": "2025-12-01T18:00:00.000Z",
      "location": "New York",
      "cateogary": "music",
      "totalSeats": 500,
      "ticketPrice": 99.99,
      "imageUrl": "https://example.com/image.jpg"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res._id) { pm.collectionVariables.set('eventId', res._id); }
    language: text/javascript
