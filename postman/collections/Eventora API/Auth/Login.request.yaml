$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "admin@eventora.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res.token) { pm.collectionVariables.set('authToken', res.token); }
      if (res.user && res.user.token) { pm.collectionVariables.set('authToken', res.user.token); }
