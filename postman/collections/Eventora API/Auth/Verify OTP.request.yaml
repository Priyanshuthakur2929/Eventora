$kind: http-request
method: POST
url: "{{baseUrl}}/api/auth/verifyOTP"
order: 3000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "john@example.com",
      "otp": "508881"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.token) { pm.collectionVariables.set('authToken', res.token); }
    language: text/javascript
